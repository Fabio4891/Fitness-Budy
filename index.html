<title>Fitness Budy</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one-column phone app, sticky header, fixed bottom tab bar. Macro colors follow weight-plate colors (blue 20 kg = protein, yellow 15 kg = carbs, red 25 kg = fat). */
:root{
  --bg:#F3F5F7; --card:#FFFFFF; --ink:#141B24; --muted:#5E6875; --line:#DDE2E8;
  --accent:#1F5FBF; --accent-soft:#E3ECFA; --ok:#1E8A55; --warn:#C27C0E; --bad:#C8352E;
  --protein:#1F5FBF; --carbs:#E0A800; --fat:#C8352E;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --card:#18202A; --ink:#E8EDF3; --muted:#9AA6B4; --line:#2A3542;
  --accent:#5B93E8; --accent-soft:#1D2D45; --ok:#45C083; --warn:#E2A53B; --bad:#EB6A62;
  --protein:#5B93E8; --carbs:#E8BE3A; --fat:#EB6A62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141A; --card:#18202A; --ink:#E8EDF3; --muted:#9AA6B4; --line:#2A3542;
  --accent:#5B93E8; --accent-soft:#1D2D45; --ok:#45C083; --warn:#E2A53B; --bad:#EB6A62;
  --protein:#5B93E8; --carbs:#E8BE3A; --fat:#EB6A62; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1}
h2{font-size:22px}
h3{font-size:18px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:42px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent}
button.icon{min-width:42px;padding:8px}
button.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:42px;width:100%;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.big{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav.tabs button{border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:8px 2px 10px;min-height:56px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.setrow input{text-align:center;padding:8px 4px}
.setrow .n{font-weight:600;color:var(--muted);text-align:center}
.check{width:48px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.hint{font-size:12.5px;color:var(--muted)}
.hint b{color:var(--ink)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);width:min(92vw,360px)}
.timer .t{font-family:var(--font-display);font-size:28px;font-weight:700;flex:1}
.timer button{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent);min-height:36px;padding:6px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:90vw}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .name{min-width:0;overflow-wrap:anywhere}
.ring{width:132px;height:132px;flex:none}
.macro{display:flex;flex-direction:column;gap:4px;min-width:0}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.water{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:30px;height:40px;border:2px solid var(--accent);border-radius:4px 4px 8px 8px;position:relative;overflow:hidden;padding:0;min-height:0;background:transparent}
.glass.full::after{content:"";position:absolute;inset:30% 0 0;background:var(--accent);opacity:.75}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;background:var(--line)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.chart svg{width:100%;height:auto;display:block}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;min-height:34px;padding:6px;background:transparent;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.week .b{width:100%;height:64px;background:var(--bg);border-radius:6px;position:relative;overflow:hidden}
.week .b i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);opacity:.8}
.week .b.over i{background:var(--warn)}
.week .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px}
.week .tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.week .today{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.results{display:flex;flex-direction:column;max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.results button{border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;display:flex;justify-content:space-between;gap:8px;font-weight:500;min-height:44px}
.plate{display:inline-block;width:6px;height:22px;border-radius:2px;margin-right:2px;vertical-align:middle}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px;text-align:center}
textarea{min-height:110px;font-family:ui-monospace,monospace;font-size:12px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
@media (max-width:360px){.grid3{grid-template-columns:1fr 1fr}.big{font-size:34px}}
</style>
</head><body>

// Photos in IndexedDB
const photoDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);try{const q=indexedDB.open('fitnessbudy-photos',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>{this.db=q.result;res(this.db)};q.onerror=()=>rej(q.error)}catch(e){rej(e)}})},
  async put(id,data){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(data,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async get(id){const db=await this.open();return new Promise(res=>{const q=db.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})},
  async del(id){const db=await this.open();return new Promise(res=>{const t=db.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res;t.onerror=res})},
};

// ---------- Targets ----------
function latestWeight(){const b=S.body.filter(x=>x.weight).sort((a,b)=>a.date<b.date?-1:1);return b.length?b[b.length-1].weight:S.profile.weight}
function targets(){
  const p=S.profile,w=latestWeight();
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.activity;
  const adj={aufbau:250,recomp:-0.1*tdee,abnehmen:-0.2*tdee}[p.goal]||0;
  const kcal=Math.round((tdee+adj)/10)*10;
  const prot=Math.round(w*(p.goal==='aufbau'?1.8:2.0));
  const fat=Math.round(w*0.9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,p:prot,f:fat,c:carb};
}
const GOALS={aufbau:'Muskelaufbau (leichter Überschuss)',recomp:'Mix: Muskeln aufbauen, Fett verlieren',abnehmen:'Abnehmen (stärkeres Defizit)'};

// ---------- Training logic ----------
function phase(dateStr){
  const wk=Math.floor(Math.max(0,daysBetween(S.profile.startDate,dateStr))/7)+1;
  if(wk<=2)return {wk,sets:2,lo:12,hi:15,label:'Wiedereinstieg',note:'Woche '+wk+': leichte Gewichte, Technik sauber, 2–3 Wiederholungen „im Tank“ lassen.'};
  if(wk<=8)return {wk,sets:3,lo:10,hi:12,label:'Aufbau',note:'Woche '+wk+': 3 Sätze. Schaffst du überall 12 Wdh., gibt es beim nächsten Mal mehr Gewicht.'};
  return {wk,sets:3,lo:8,hi:10,label:'Kraft',note:'Woche '+wk+': schwerer, 8–10 Wdh. Bei 10 Wdh. in allen Sätzen erhöhen.'};
}
const doneWorkouts=()=>S.workouts.filter(w=>w.done).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0));
function nextDay(){const d=doneWorkouts();if(!d.length)return 'A';return d[d.length-1].day==='A'?'B':'A'}
function lastFor(exId){const d=doneWorkouts();for(let i=d.length-1;i>=0;i--){const e=d[i].exercises.find(x=>x.id===exId&&x.sets.some(s=>s.done));if(e)return {date:d[i].date,sets:e.sets.filter(s=>s.done)}}return null}
function suggest(exId,ph){
  const ex=EXERCISES[exId],last=lastFor(exId);
  if(!last)return {w:'',r:ph.hi,text:ex.time?'Starte mit 20–30 Sekunden.':'Erstes Mal: wähle ein Gewicht, mit dem '+ph.hi+' Wdh. locker gehen.'};
  const sets=last.sets,topW=Math.max(...sets.map(s=>+s.w||0));
  const allTop=sets.length>=ph.sets&&sets.every(s=>(+s.r||0)>=ph.hi);
  const lastTxt=sets.map(s=>(ex.time?'':fmt(+s.w||0)+'×')+(s.r||0)+(ex.time?' s':'')).join(', ');
  if(ex.time){const best=Math.max(...sets.map(s=>+s.r||0));return {w:0,r:best+5,text:'Letztes Mal ('+fmtDate(last.date)+'): '+lastTxt+'. Heute: +5 Sekunden.'}}
  if(allTop)return {w:r1(topW+ex.inc),r:ph.lo,up:true,text:'Letztes Mal ('+fmtDate(last.date)+'): '+lastTxt+'. Alle Sätze geschafft, also heute '+fmt(topW+ex.inc)+' kg.'};
  return {w:topW,r:Math.min(ph.hi,Math.max(...sets.map(s=>+s.r||0))+1),text:'Letztes Mal ('+fmtDate(last.date)+'): '+lastTxt+'. Gleiches Gewicht, versuch 1 Wdh. mehr.'};
}
function startWorkout(day){
  const ph=phase(today());
  S.active={id:uid(),date:today(),t:Date.now(),day,done:false,cardio:false,
    exercises:PLANS[day].ex.map(id=>{const s=suggest(id,ph);return {id,sets:Array.from({length:ph.sets},()=>({w:s.w===''?'':s.w,r:s.r,done:false}))}})};
  save();render();
}
const e1rm=(w,r)=>w*(1+r/30);

// ---------- Food logic ----------
function dayFood(d){if(!S.food[d])S.food[d]={items:[],water:0,supps:{}};return S.food[d]}
function sumItems(items){return items.reduce((a,i)=>({kcal:a.kcal+i.kcal,p:a.p+i.p,c:a.c+i.c,f:a.f+i.f}),{kcal:0,p:0,c:0,f:0})}
function allFoods(){return S.customFoods.concat(FOODS)}
function findFood(n){return allFoods().find(f=>f.name===n)}
function itemFrom(food,g,meal){const k=g/100;return {id:uid(),meal,name:food.name,g,kcal:Math.round(food.kcal*k),p:r1(food.p*k),c:r1(food.c*k),f:r1(food.f*k)}}
function scaledPlan(idx){
  const plan=DAYPLANS[idx],t=targets();
  let base=0;for(const m in plan.meals)for(const [n,g] of plan.meals[m])base+=findFood(n).kcal*g/100;
  const k=t.kcal/base,out={};
  for(const m in plan.meals)out[m]=plan.meals[m].map(([n,g])=>{const f=findFood(n);let gg=g*k;gg=f.unit==='Stk'&&n==='Ei'?Math.max(1,Math.round(gg/f.portion))*f.portion:Math.round(gg/5)*5;return itemFrom(f,gg,m)});
  return out;
}
function amountLabel(item){const f=findFood(item.name);if(f&&f.unit==='Stk'&&item.name==='Ei')return Math.round(item.g/f.portion)+' Stk';return item.g+(f&&f.unit==='ml'?' ml':' g')}

// ---------- Views ----------
const VIEWS={};
function ringSVG(val,goal){
  const pct=Math.min(1,goal?val/goal:0),R=54,C=2*Math.PI*R,over=val>goal*1.05;
  return `<svg class="ring" viewBox="0 0 132 132" role="img" aria-label="${val} von ${goal} kcal"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/>${pct>0?`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${over?'var(--warn)':'var(--accent)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 66 66)"/>`:''}<text x="66" y="64" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="30" fill="var(--ink)">${val}</text><text x="66" y="84" text-anchor="middle" font-size="11" fill="var(--muted)">von ${goal} kcal</text></svg>`;
}
function macroBars(sum,t){
  return [['Protein','p','--protein'],['Kohlenhydrate','c','--carbs'],['Fett','f','--fat']].map(([l,k,c])=>`<div class="macro"><div class="row between small"><span><span class="dot" style="background:var(${c})"></span> ${l}</span><span class="num muted">${Math.round(sum[k])} / ${t[k]} g</span></div><div class="bar"><i style="width:${Math.min(100,sum[k]/t[k]*100)}%;background:var(${c})"></i></div></div>`).join('');
}
function waterBlock(d){
  const f=dayFood(d),p=S.profile,n=Math.ceil(p.waterGoal/p.glass),full=Math.floor(f.water/p.glass);
  let g='';for(let i=0;i<Math.max(n,full);i++)g+=`<button class="glass ${i<full?'full':''}" data-act="water-set" data-n="${i<full&&i===full-1?i:i+1}" data-d="${d}" aria-label="${(i+1)*p.glass} ml"></button>`;
  return `<div class="card"><div class="row between"><h3>Wasser</h3><span class="num ${f.water>=p.waterGoal?'chip ok':'muted'}">${fmt(f.water/1000)} / ${fmt(p.waterGoal/1000)} l</span></div><div class="water">${g}</div><div class="row"><button data-act="water-add" data-ml="${p.glass}" data-d="${d}">+ ${p.glass} ml</button><button data-act="water-add" data-ml="500" data-d="${d}">+ 500 ml</button><button class="ghost" data-act="water-add" data-ml="-${p.glass}" data-d="${d}">−</button></div></div>`;
}
function suppBlock(d){
  const f=dayFood(d),sp=S.profile.supplements;
  if(!sp.length)return '';
  return `<div class="card"><h3>Supplements</h3><div class="list">${sp.map(s=>`<label class="li" style="flex-direction:row;color:var(--ink);font-size:15px"><span class="name">${esc(s)}</span><input type="checkbox" style="width:24px;min-height:24px" data-act="supp" data-d="${d}" data-s="${esc(s)}" ${f.supps[s]?'checked':''}></label>`).join('')}</div></div>`;
}
VIEWS.heute=()=>{
  const t=targets(),d=today(),f=dayFood(d),sum=sumItems(f.items),p=S.profile;
  const until=daysBetween(d,p.startDate);
  const wkStart=mondayOf(d),thisWeek=doneWorkouts().filter(w=>w.date>=wkStart).length;

  else if(until>0)train=`<div class="card"><span class="eyebrow">Gym-Start</span><div class="row between"><div><div class="big num">${until} ${until===1?'Tag':'Tage'}</div><div class="muted small">bis zum ersten Training am ${fmtDate(p.startDate)}</div></div><span class="chip">${ph.label}</span></div><p class="small" style="margin:0">Dein Plan steht: abwechselnd <b>Ganzkörper A</b> und <b>B</b>, ${p.trainDays.length}× pro Woche (${p.trainDays.map(i=>WD[i]).join(', ')}). Die ersten zwei Wochen sind bewusst leicht.</p><button data-act="tab" data-tab="training">Plan ansehen</button></div>`;
  else train=`<div class="card"><div class="row between"><div><span class="eyebrow">${isDay?'Heute ist Trainingstag':'Nächstes Training'}</span><h2>${plan.name}</h2></div><span class="chip ${thisWeek>=p.trainDays.length?'ok':''}">${thisWeek} / ${p.trainDays.length} diese Woche</span></div><div class="small muted">${plan.ex.map(e=>EXERCISES[e].n).join(' · ')}</div><button class="primary" data-act="start" data-day="${nd}">${plan.name} starten</button></div>`;
  const lw=S.body.find(b=>b.date===d);
  return train+`
  <div class="card"><div class="row between"><h3>Kalorien heute</h3><button class="ghost small" data-act="tab" data-tab="essen">Essen eintragen</button></div>
    <div class="row" style="gap:16px;flex-wrap:nowrap">${ringSVG(sum.kcal,t.kcal)}<div class="stack" style="flex:1;gap:10px;min-width:0">${macroBars(sum,t)}</div></div>
    <div class="small muted">Noch <b class="num" style="color:var(--ink)">${Math.max(0,t.kcal-sum.kcal)} kcal</b> übrig.</div></div>
  ${waterBlock(d)}
  ${suppBlock(d)}
  <div class="card"><h3>Gewicht heute</h3><div class="row" style="flex-wrap:nowrap"><input id="quick-weight" type="number" inputmode="decimal" step="0.1" placeholder="${fmt(latestWeight())}" value="${lw&&lw.weight?lw.weight:''}" aria-label="Gewicht in kg"><span class="muted">kg</span><button data-act="quick-weight">Speichern</button></div><div class="hint">Am besten morgens nach dem Aufstehen wiegen.</div></div>`;
};

VIEWS.training=()=>{
  const p=S.profile,ph=phase(today());
  if(S.active)return activeWorkoutView();
  const nd=nextDay();
  const hist=doneWorkouts().slice(-8).reverse();
  const planCard=k=>{const pl=PLANS[k];return `<div class="card"><div class="row between"><h3>${pl.name}</h3>${k===nd?'<span class="chip">als Nächstes</span>':''}</div><div class="list">${pl.ex.map(e=>{const s=suggest(e,ph);const ex=EXERCISES[e];return `<div class="li"><span class="name">${esc(ex.n)}</span><span class="small muted num" style="text-align:right">${ph.sets}×${ex.time?'Zeit':ph.lo+'–'+ph.hi}${s.w!==''&&!ex.time?' · '+fmt(s.w)+' kg':''}</span></div>`}).join('')}<div class="li"><span class="name small">Ausdauer: ${esc(pl.cardio)}</span></div></div><button class="${k===nd?'primary':''}" data-act="start" data-day="${k}">${pl.name} starten</button></div>`};
  return `<div class="card"><span class="eyebrow">Dein Plan · Phase „${ph.label}“</span><p style="margin:0">${ph.note}</p><p class="small muted" style="margin:0">Ganzkörper A und B im Wechsel, ${p.trainDays.length}× pro Woche. Jede Einheit dauert etwa 60 Minuten inkl. 5 Minuten Aufwärmen und Ausdauer am Schluss. Pause zwischen den Sätzen: ${p.restSec} s.</p></div>
  ${planCard(nd)}${planCard(nd==='A'?'B':'A')}
  <div class="card"><h3>Letzte Trainings</h3>${hist.length?`<div class="list">${hist.map(w=>{const vol=w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);return `<div class="li"><span class="name">${fmtDate(w.date)} · ${PLANS[w.day].name}</span><span class="small muted num">${Math.round(vol).toLocaleString('de-CH')} kg Volumen</span></div>`}).join('')}</div>`:`<div class="empty">Noch kein Training gespeichert. Ab dem ${fmtDate(p.startDate)} geht’s los.</div>`}</div>`;
};
function activeWorkoutView(){

  <div class="card"><label style="flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px"><input type="checkbox" style="width:24px;min-height:24px" data-act="cardio" ${a.cardio?'checked':''}> Ausdauer erledigt</label><div class="hint">${esc(pl.cardio)}</div></div>
  <div class="row"><button class="primary" style="flex:1" data-act="finish">Training abschliessen</button><button class="ghost danger" data-act="discard">Verwerfen</button></div>`;

function lineChart(pts,{unit='',avg=false,color='var(--accent)'}={}){
  if(pts.length<2)return `<div class="empty">Für ein Diagramm braucht es mindestens zwei Einträge.</div>`;
  const W=340,H=180,L=36,R=10,T=12,B=26;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+864e5;
  let y0=Math.min(...ys),y1=Math.max(...ys);const padY=Math.max((y1-y0)*0.15,0.5);y0-=padY;y1+=padY;
  const step=niceStep((y1-y0)/4);y0=Math.floor(y0/step)*step;y1=Math.ceil(y1/step)*step;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R),sy=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';for(let v=y0;v<=y1+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(v)}</text>`;
  const ticks=[pts[0],pts[Math.floor(pts.length/2)],pts[pts.length-1]].filter((p,i,a)=>a.indexOf(p)===i);
  ticks.forEach((p,i)=>{const d=new Date(p.x);g+=`<text x="${sx(p.x)}" y="${H-8}" text-anchor="${i===0?'start':i===ticks.length-1?'end':'middle'}" font-size="10" fill="var(--muted)">${d.getDate()}.${d.getMonth()+1}.</text>`});
  const path=pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join('');
  const area=path+`L${sx(pts[pts.length-1].x).toFixed(1)} ${H-B}L${sx(pts[0].x).toFixed(1)} ${H-B}Z`;
  let avgPath='';
  if(avg&&pts.length>=3){const a=pts.map((p,i)=>{const w=pts.filter(q=>q.x<=p.x&&q.x>p.x-7*864e5);return {x:p.x,y:w.reduce((s,q)=>s+q.y,0)/w.length}});avgPath=`<path d="${a.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join('')}" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3"/>`}
  const lp=pts[pts.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">${g}<path d="${area}" fill="${color}" fill-opacity=".1"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${avgPath}${pts.map(p=>`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="2.5" fill="${color}"/>`).join('')}<circle cx="${sx(lp.x)}" cy="${sy(lp.y)}" r="5" fill="var(--card)" stroke="${color}" stroke-width="2.5"/></svg></div>`;
}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
VIEWS.verlauf=()=>{
  const t=targets(),d=today(),ws=mondayOf(d),p=S.profile;
  const days=[...Array(7)].map((_,i)=>addDays(ws,i));
  const wo=doneWorkouts();
  const kc=days.map(x=>sumItems((S.food[x]||{items:[]}).items).kcal);
  const logged=kc.filter(k=>k>0);const avgK=logged.length?Math.round(logged.reduce((a,b)=>a+b,0)/logged.length):0;
  const water=days.map(x=>(S.food[x]||{}).water||0).filter(w=>w>0);const avgW=water.length?water.reduce((a,b)=>a+b,0)/water.length:0;
  const wInRange=(a,b)=>{const e=S.body.filter(x=>x.weight&&x.date>=a&&x.date<=b);return e.length?e.reduce((s,x)=>s+x.weight,0)/e.length:null};
  const wNow=wInRange(ws,addDays(ws,6)),wPrev=wInRange(addDays(ws,-7),addDays(ws,-1));
  const nTrain=wo.filter(w=>w.date>=ws&&w.date<=addDays(ws,6)).length;
  const maxK=Math.max(t.kcal*1.2,...kc);
  const week=`<div class="card"><div class="row between"><h3>Diese Woche</h3><span class="small muted">${fmtDate(ws)} – ${fmtDate(addDays(ws,6))}</span></div>
   <div class="week">${days.map((x,i)=>{const tr=wo.some(w=>w.date===x);return `<div class="d ${x===d?'today':''}"><span>${WD[i]}</span><span class="tick ${tr?'on':''}" title="${tr?'Training':''}">${tr?'✓':p.trainDays.includes(i)?'·':''}</span><div class="b ${kc[i]>t.kcal*1.1?'over':''}" title="${kc[i]} kcal"><i style="height:${kc[i]/maxK*100}%"></i></div><span class="num">${kc[i]?fmt(kc[i]/1000)+'k':'–'}</span></div>`}).join('')}</div>
   <div class="grid2 small"><div><span class="eyebrow">Trainings</span><div class="num"><b>${nTrain}</b> von ${p.trainDays.length}</div></div><div><span class="eyebrow">Ø Kalorien</span><div class="num"><b>${avgK||'–'}</b> / ${t.kcal}</div></div><div><span class="eyebrow">Ø Wasser</span><div class="num"><b>${avgW?fmt(avgW/1000)+' l':'–'}</b> / ${fmt(p.waterGoal/1000)} l</div></div><div><span class="eyebrow">Ø Gewicht</span><div class="num"><b>${wNow?fmt(wNow)+' kg':'–'}</b>${wNow&&wPrev?` <span class="${wNow-wPrev<=0?'chip ok':'chip warn'}">${wNow-wPrev>0?'+':''}${fmt(wNow-wPrev)}</span>`:''}</div></div></div></div>`;
  let chart='';
  const seg=`<div class="seg" role="group" aria-label="Diagramm">${[['gewicht','Gewicht'],['umfang','Umfänge'],['kraft','Kraft'],['kalorien','Kalorien']].map(([k,l])=>`<button data-act="vsub" data-k="${k}" aria-pressed="${sub.verlauf===k}">${l}</button>`).join('')}</div>`;
  if(sub.verlauf==='gewicht'){const pts=S.body.filter(x=>x.weight).sort((a,b)=>a.date<b.date?-1:1).map(x=>({x:+parse(x.date),y:x.weight}));chart=`<h3>Gewicht (kg)</h3>${lineChart(pts,{avg:true})}<div class="hint">Gestrichelt: 7-Tage-Durchschnitt. Der zählt mehr als einzelne Tage.</div>`}
  else if(sub.verlauf==='umfang'){const ptsW=S.body.filter(x=>x.waist).sort((a,b)=>a.date<b.date?-1:1).map(x=>({x:+parse(x.date),y:x.waist}));const ptsA=S.body.filter(x=>x.arm).sort((a,b)=>a.date<b.date?-1:1).map(x=>({x:+parse(x.date),y:x.arm}));chart=`<h3>Bauchumfang (cm)</h3>${lineChart(ptsW,{color:'var(--fat)'})}<h3>Armumfang (cm)</h3>${lineChart(ptsA,{color:'var(--protein)'})}`}
  else if(sub.verlauf==='kraft'){const used=Object.keys(EXERCISES).filter(k=>!EXERCISES[k].time);const pts=wo.map(w=>{const e=w.exercises.find(x=>x.id===sub.ex);if(!e)return null;const best=Math.max(0,...e.sets.filter(s=>s.done&&+s.w>0).map(s=>e1rm(+s.w,+s.r)));return best?{x:+parse(w.date)+(w.t||0)%864e5,y:r1(best)}:null}).filter(Boolean);chart=`<label>Übung<select data-act="vex">${used.map(k=>`<option value="${k}" ${k===sub.ex?'selected':''}>${esc(EXERCISES[k].n)}</option>`).join('')}</select></label><h3>Geschätztes Maximalgewicht (kg)</h3>${lineChart(pts,{color:'var(--ok)'})}<div class="hint">Aus deinem besten Satz berechnet (Epley-Formel). Steigt die Linie, wirst du stärker.</div>`}
  else{const last=[...Array(14)].map((_,i)=>addDays(d,i-13));const pts=last.map(x=>({x:+parse(x),y:sumItems((S.food[x]||{items:[]}).items).kcal})).filter(p=>p.y>0);chart=`<h3>Kalorien, letzte 14 Tage</h3>${lineChart(pts,{color:'var(--carbs)'})}<div class="hint">Ziel: ${t.kcal} kcal pro Tag.</div>`}
  return week+`<div class="card">${seg}${chart}</div>`;
};

// ---------- Timer ----------
let timer={end:0,h:null};
function startTimer(sec){timer.end=Date.now()+sec*1000;$('#timer').hidden=false;tick();clearInterval(timer.h);timer.h=setInterval(tick,250);try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>timer.lock=l).catch(()=>{})}catch(e){}}
function tick(){const left=Math.max(0,Math.round((timer.end-Date.now())/1000));$('#timer-t').textContent=Math.floor(left/60)+':'+pad(left%60);if(left<=0){stopTimer();alarm()}}
function stopTimer(){clearInterval(timer.h);$('#timer').hidden=true;try{timer.lock&&timer.lock.release()}catch(e){}}
let audioCtx=null;
function alarm(){try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();[0,0.25,0.5].forEach(o=>{const os=audioCtx.createOscillator(),g=audioCtx.createGain();os.frequency.value=880;g.gain.value=0.15;os.connect(g);g.connect(audioCtx.destination);os.start(audioCtx.currentTime+o);os.stop(audioCtx.currentTime+o+0.15)})}catch(e){}
  try{if(window.Notification&&Notification.permission==='granted'&&document.hidden)new Notification('Pause vorbei',{body:'Weiter mit dem nächsten Satz.'})}catch(e){}
  toast('Pause vorbei. Nächster Satz!')}

// ---------- ICS ----------
function ics(){
  const p=S.profile,BY=['MO','TU','WE','TH','FR','SA','SU'];
  const start=p.startDate>today()?p.startDate:today(),dt=start.replace(/-/g,'');
  const ev=(id,summary,time,rrule,desc)=>['BEGIN:VEVENT','UID:'+id+'@fitnessbudy','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+dt+'T'+time.replace(':','')+'00','DURATION:PT'+(id.startsWith('train')?'60':'5')+'M','RRULE:'+rrule,'SUMMARY:'+summary,'DESCRIPTION:'+desc,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+summary,'TRIGGER:'+(id.startsWith('train')?'-PT60M':'PT0M'),'END:VALARM','END:VEVENT'].join('\r\n');
  const evs=[ev('train','Gym: Ganzkörper-Training',p.trainTime,'FREQ=WEEKLY;BYDAY='+p.trainDays.map(i=>BY[i]).join(','),'Training in Fitness Budy starten')];
  [['fr','Frühstück eintragen','07:30'],['mi','Mittagessen eintragen','12:30'],['ab','Abendessen eintragen','19:30']].forEach(([id,s,t])=>evs.push(ev('meal-'+id,s,t,'FREQ=DAILY','Mahlzeit in Fitness Budy erfassen')));
  ['10:00','15:00','17:30'].forEach((t,i)=>evs.push(ev('water-'+i,'Wasser trinken','' +t,'FREQ=DAILY','Ein Glas Wasser trinken und eintragen')));
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fitness Budy//DE','CALSCALE:GREGORIAN'].concat(evs,['END:VCALENDAR']).join('\r\n');
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

// ---------- Photo ----------
let photoForDate=null;
async function handlePhoto(file){
  const url=URL.createObjectURL(file);const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
  const max=1000,k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const data=c.toDataURL('image/jpeg',0.82);URL.revokeObjectURL(url);
  const id='p-'+uid();await photoDB.put(id,data);
  const d=photoForDate||today();let e=S.body.find(x=>x.date===d&&!x.photo);if(!e){e={id:uid(),date:d};S.body.push(e)}e.photo=id;save();render();toast('Foto gespeichert');
}

// ---------- Events ----------
document.addEventListener('click',async ev=>{
  const tb=ev.target.closest('[data-tab]');if(tb&&tb.closest('nav.tabs')){setTab(tb.dataset.tab);return}
  const el=ev.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='INPUT'&&el.type!=='checkbox')return;if(el.tagName==='SELECT')return;
  const a=el.dataset.act,ds=el.dataset;
  switch(a){
    case 'tab':setTab(ds.tab);break;
    case 'open-settings':settingsSheet();break;
    case 'close':closeSheet();break;
    case 'start':if(S.active){toast('Es läuft schon ein Training.');setTab('training');break}startWorkout(ds.day);setTab('training');break;
    case 'set-done':{const s=S.active.exercises[+ds.e].sets[+ds.s];s.done=!s.done;save();render();if(s.done){const isLast=S.active.exercises.every(e=>e.sets.every(x=>x.done));if(!isLast)startTimer(S.profile.restSec)}break}
    case 'set-add':{const e=S.active.exercises[+ds.e];const l=e.sets[e.sets.length-1];e.sets.push({w:l.w,r:l.r,done:false});save();render();break}
    case 'set-rm':{const e=S.active.exercises[+ds.e];e.sets.pop();save();render();break}
    case 'cardio':S.active.cardio=el.checked;save();break;
    case 'finish':{const a2=S.active;if(!a2.exercises.some(e=>e.sets.some(s=>s.done))){toast('Hake mindestens einen Satz ab.');break}a2.done=true;S.workouts.push(a2);S.active=null;save();stopTimer();setTab('training');toast('Training gespeichert. Stark!');break}
    case 'discard':if(el.dataset.confirm){S.active=null;save();stopTimer();render();}else{el.dataset.confirm='1';el.textContent='Wirklich verwerfen?';setTimeout(()=>{if(el.isConnected){delete el.dataset.confirm;el.textContent='Verwerfen'}},3000)}break;
    case 'timer-add':timer.end+=30000;tick();break;
    case 'timer-stop':stopTimer();break;
    case 'water-add':{const f=dayFood(ds.d);f.water=Math.max(0,f.water+(+ds.ml));save();render();break}
    case 'water-set':{const f=dayFood(ds.d);f.water=(+ds.n)*S.profile.glass;save();render();break}
    case 'supp':{const f=dayFood(ds.d);f.supps[ds.s]=el.checked;save();break}
    case 'quick-weight':{const v=parseFloat(String($('#quick-weight').value).replace(',','.'));if(!(v>30&&v<300)){toast('Bitte ein Gewicht in kg eingeben.');break}let e=S.body.find(x=>x.date===today());if(!e){e={id:uid(),date:today()};S.body.push(e)}e.weight=v;save();render();toast('Gewicht gespeichert');break}
    case 'day-shift':sub.essen=addDays(sub.essen,+ds.n);if(sub.essen>today())sub.essen=today();render();break;
    case 'food-add':foodSheet(ds.meal);break;
    case 'food-pick':pickFood(ds.name);break;
    case 'food-portion':$('#food-g').value=ds.g;calcFood();break;
    case 'food-confirm':{const g=+$('#food-g').value;if(!(g>0)){toast('Bitte eine Menge eingeben.');break}dayFood(sub.essen).items.push(itemFrom(foodCtx.sel,g,foodCtx.meal));save();closeSheet();render();toast(foodCtx.sel.name+' hinzugefügt');break}
    case 'food-rm':{const f=dayFood(ds.d);f.items=f.items.filter(i=>i.id!==ds.id);save();render();break}
    case 'cf-save':{const n=$('#cf-name').value.trim(),k=+$('#cf-kcal').value;if(!n||!(k>=0)){toast('Name und kcal ausfüllen.');break}const f={name:n,kcal:k,p:+$('#cf-p').value||0,c:+$('#cf-c').value||0,f:+$('#cf-f').value||0,portion:+$('#cf-portion').value||100,unit:'g'};S.customFoods=S.customFoods.filter(x=>x.name!==n);S.customFoods.unshift(f);save();renderFoodResults(n);pickFood(n);break}
    case 'plan':sub.plan=+ds.i;render();break;
    case 'plan-take':{const sp=scaledPlan(sub.plan)[ds.meal];dayFood(sub.essen).items.push(...sp.map(i=>({...i,id:uid()})));save();render();toast('Übernommen');break}
    case 'plan-take-all':{const sp=scaledPlan(sub.plan);MEALS.forEach(([k])=>dayFood(sub.essen).items.push(...sp[k].map(i=>({...i,id:uid()}))));save();render();toast('Ganzer Tag übernommen');break}
    case 'body-save':{const g=id=>{const v=parseFloat(String($(id).value).replace(',','.'));return v>0?v:null};const w=g('#b-weight'),wa=g('#b-waist'),ar=g('#b-arm'),d=$('#b-date').value||today();if(!w&&!wa&&!ar){toast('Mindestens einen Wert eingeben.');break}let e=S.body.find(x=>x.date===d);if(!e){e={id:uid(),date:d};S.body.push(e)}if(w)e.weight=w;if(wa)e.waist=wa;if(ar)e.arm=ar;save();render();toast('Messung gespeichert');break}
    case 'body-rm':{const e=S.body.find(x=>x.id===ds.id);if(e&&e.photo)photoDB.del(e.photo).catch(()=>{});S.body=S.body.filter(x=>x.id!==ds.id);save();render();break}
    case 'photo':photoForDate=($('#b-date')||{}).value||today();$('#photo-input').click();break;
    case 'vsub':sub.verlauf=ds.k;render();break;
    case 'settings-save':{const p=S.profile;p.name=$('#s-name').value.trim()||p.name;p.age=+$('#s-age').value||p.age;p.height=+$('#s-height').value||p.height;p.sex=$('#s-sex').value;p.goal=$('#s-goal').value;p.activity=+$('#s-act').value;p.startDate=$('#s-start').value||p.startDate;const days=[...document.querySelectorAll('.s-day:checked')].map(x=>+x.value);if(days.length)p.trainDays=days;p.trainTime=$('#s-time').value||p.trainTime;p.restSec=+$('#s-rest').value||p.restSec;p.waterGoal=+$('#s-water').value||p.waterGoal;p.glass=+$('#s-glass').value||p.glass;p.supplements=$('#s-supps').value.split('\n').map(s=>s.trim()).filter(Boolean);save();closeSheet();render();toast('Gespeichert');break}
    case 'ics':download('fitness-budy-erinnerungen.ics',ics(),'text/calendar');toast('Datei öffnen und in den Kalender übernehmen');break;
    case 'notif':try{if(!window.Notification){toast('Dieser Browser unterstützt keine Benachrichtigungen.');break}const r=await Notification.requestPermission();toast(r==='granted'?'Benachrichtigungen erlaubt':'Benachrichtigungen nicht erlaubt')}catch(e){toast('Hier nicht möglich. In der installierten App erneut versuchen.')}break;
    case 'backup-copy':{const txt=JSON.stringify(S);try{await navigator.clipboard.writeText(txt);toast('Backup in die Zwischenablage kopiert')}catch(e){const ta=$('#s-import');ta.value=txt;ta.select();toast('Text markiert: jetzt kopieren')}break}
    case 'backup-dl':download('fitness-budy-backup-'+today()+'.json',JSON.stringify(S),'application/json');break;
    case 'backup-import':{try{const d=JSON.parse($('#s-import').value);if(!d.profile||!d.workouts)throw 0;S=Object.assign(defaults(),d);save();closeSheet();render();toast('Backup wiederhergestellt')}catch(e){toast('Das sieht nicht nach einem Fitness-Budy-Backup aus.')}break}
    case 'reset':if(el.dataset.confirm){try{localStorage.removeItem(KEY)}catch(e){}S=defaults();save();closeSheet();render();toast('Alles gelöscht')}else{el.dataset.confirm='1';el.textContent='Sicher? Nochmals tippen zum Löschen'}break;
  }
});
document.addEventListener('input',ev=>{
  const el=ev.target,a=el.dataset.act;
  if(el.id==='food-q')renderFoodResults(el.value);
  else if(el.id==='food-g')calcFood();
  else if(a==='set-w'||a==='set-r'){const s=S.active.exercises[+el.dataset.e].sets[+el.dataset.s];const v=String(el.value).replace(',','.');s[a==='set-w'?'w':'r']=v===''?'':+v;if(a==='set-w'&&v!==''){const ex=S.active.exercises[+el.dataset.e];ex.sets.forEach((x,i)=>{if(i>+el.dataset.s&&!x.done&&x.w===''){x.w=+v;const inp=document.getElementById('w-'+el.dataset.e+'-'+i);if(inp)inp.value=v}})}save()}
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.act==='vex'){sub.ex=el.value;render()}if(el.id==='photo-input'&&el.files[0]){handlePhoto(el.files[0]).catch(()=>toast('Foto konnte nicht gespeichert werden.'));el.value=''}});
$('#sheet').addEventListener('click',ev=>{if(ev.target.id==='sheet')closeSheet()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==tab){tab=h;render()}});

// ---------- Boot ----------
(function boot(){const h=location.hash.slice(1);let t=null;try{t=localStorage.getItem(KEY+'.tab')}catch(e){}tab=VIEWS[h]?h:(VIEWS[t]?t:'heute');if(S.active)tab=VIEWS[h]?h:'training';render();save()})();
})();
</script>
